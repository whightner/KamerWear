# Alembic configuration. Run alembic commands from inside backend/.
# The database URL is NOT set here: alembic/env.py reads DATABASE_URL from app settings.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Name migration files like 2026_10_03_1200-ab12cd34ef56_create_products.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
